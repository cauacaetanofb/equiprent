<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${equipmentId == null ? 'Novo equipamento' : 'Editar equipamento'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="conteudo" class="container py-5">
    <section class="card form-card mx-auto p-4 p-md-5" aria-labelledby="titulo">
        <a th:href="@{/equipamentos}" class="mb-4">Voltar para equipamentos</a>
        <p class="eyebrow text-secondary">ADMINISTRAÇÃO</p>
        <h1 id="titulo" class="h2" th:text="${equipmentId == null ? 'Novo equipamento' : 'Editar equipamento'}"></h1>
        <p class="text-secondary">Cadastre uma unidade física por vez, com seu próprio código patrimonial.</p>
        <form th:action="${equipmentId == null} ? @{/admin/equipamentos} : @{/admin/equipamentos/{id}/editar(id=${equipmentId})}" th:object="${equipmentForm}" method="post">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">Revise os campos indicados antes de salvar.</div>
            <div class="mb-3">
                <label for="assetCode" class="form-label">Código patrimonial</label>
                <input th:field="*{assetCode}" th:readonly="${equipmentId != null}" class="form-control" th:classappend="${#fields.hasErrors('assetCode')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('assetCode')}" aria-describedby="assetCode-help assetCode-error" maxlength="50" required>
                <div id="assetCode-help" class="form-text">Identifica esta unidade e não pode ser alterado após o cadastro.</div>
                <div id="assetCode-error" class="invalid-feedback" th:errors="*{assetCode}"></div>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Nome</label>
                <input th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('name')}" aria-describedby="name-error" maxlength="120" required>
                <div id="name-error" class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descrição</label>
                <textarea th:field="*{description}" rows="4" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('description')}" aria-describedby="description-error" maxlength="2000" required></textarea>
                <div id="description-error" class="invalid-feedback" th:errors="*{description}"></div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-sm-6">
                    <label for="category" class="form-label">Categoria</label>
                    <select th:field="*{category}" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('category')}" aria-describedby="category-error" required>
                        <option value="">Selecione</option>
                        <option th:each="category : ${categories}" th:value="${category}" th:text="${category.label}"></option>
                    </select>
                    <div id="category-error" class="invalid-feedback" th:errors="*{category}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="dailyRate" class="form-label">Diária (R$)</label>
                    <input th:field="*{dailyRate}" type="number" step="0.01" min="0.01" max="9999999999.99" class="form-control" th:classappend="${#fields.hasErrors('dailyRate')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('dailyRate')}" aria-describedby="dailyRate-error" required>
                    <div id="dailyRate-error" class="invalid-feedback" th:errors="*{dailyRate}"></div>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary">Salvar equipamento</button>
                <a th:href="${equipmentId == null} ? @{/equipamentos} : @{/equipamentos/{id}(id=${equipmentId})}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
