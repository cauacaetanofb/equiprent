<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minha conta')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="conteudo" class="container py-5">
    <p class="eyebrow text-secondary">MINHA CONTA</p>
    <h1 class="h2 mb-4">Olá, <span th:text="${accountName}">usuário</span>!</h1>
    <section class="card p-4 mb-4" aria-labelledby="dados-titulo">
        <h2 id="dados-titulo" class="h5">Seus dados</h2>
        <dl class="row mb-0">
            <dt class="col-sm-3">E-mail</dt><dd class="col-sm-9 text-break" th:text="${accountEmail}"></dd>
            <dt class="col-sm-3">Perfil</dt><dd class="col-sm-9" th:text="${accountRole == 'ADMIN' ? 'Administrador' : 'Cliente'}"></dd>
        </dl>
    </section>
    <section th:if="${isAdmin}" class="card p-4" aria-labelledby="admin-titulo">
        <h2 id="admin-titulo" class="h5">Administração</h2>
        <p class="text-secondary">Cadastre clientes e gerencie os acessos ao sistema.</p>
        <div><a class="btn btn-primary" th:href="@{/admin/clientes}">Gerenciar clientes</a></div>
    </section>
    <p th:unless="${isAdmin}" class="text-secondary">Seu acesso está pronto. A consulta de equipamentos e as reservas estarão disponíveis nas próximas etapas do projeto.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
