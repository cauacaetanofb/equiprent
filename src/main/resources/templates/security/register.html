<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="conteudo" tabindex="-1" class="container py-5">
    <section class="card auth-card mx-auto p-4 p-md-5" aria-labelledby="titulo">
        <p class="eyebrow text-secondary">SUA CONTA PESSOAL</p>
        <h1 id="titulo" class="h2 mb-3">Crie sua conta</h1>
        <p class="text-secondary">Alugue equipamentos de diferentes empresas e acompanhe suas reservas em um só lugar.</p>
        <form th:action="@{/cadastro}" th:object="${registrationForm}" method="post">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert" tabindex="-1" autofocus>
                <p class="mb-1">Revise os dados:</p>
                <ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul>
            </div>
            <div class="mb-3"><label for="name" class="form-label">Nome</label>
                <input th:field="*{name}" class="form-control" maxlength="120" autocomplete="name" required th:attr="aria-invalid=${#fields.hasErrors('name')}"></div>
            <div class="mb-3"><label for="email" class="form-label">E-mail</label>
                <input th:field="*{email}" type="email" class="form-control" maxlength="254" autocomplete="username" required th:attr="aria-invalid=${#fields.hasErrors('email')}"></div>
            <div class="mb-3"><label for="password" class="form-label">Senha</label>
                <input id="password" name="password" type="password" class="form-control" minlength="12" maxlength="64" autocomplete="new-password" aria-describedby="password-help" required th:attr="aria-invalid=${#fields.hasErrors('password')}">
                <p id="password-help" class="form-text">Use de 12 a 64 caracteres.</p></div>
            <div class="mb-4"><label for="passwordConfirmation" class="form-label">Confirmar senha</label>
                <input id="passwordConfirmation" name="passwordConfirmation" type="password" class="form-control" minlength="12" maxlength="64" autocomplete="new-password" required th:attr="aria-invalid=${#fields.hasErrors('passwordConfirmation') or #fields.hasErrors('passwordConfirmed')}"></div>
            <button type="submit" class="btn btn-primary w-100">Criar conta de cliente</button>
        </form>
        <p class="small mt-4 mb-0">Já tem conta? <a th:href="@{/login}">Entrar</a>.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
