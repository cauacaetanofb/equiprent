# Perfil local opcional; não reutiliza DB_* nem o bootstrap do ambiente normal.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:${DEMO_DB_PORT:5440}/equiprent_demo
    username: equiprent_demo
    password: ${DEMO_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/demo

server:
  address: 127.0.0.1
  port: ${DEMO_SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: EQUIPRENT_DEMO_SESSION

equiprent:
  bootstrap:
    enabled: false
  demo:
    password: ${DEMO_ACCOUNT_PASSWORD:}
